name: CAELab V4.6 CI

on:
  push:
    branches: [main, develop, 'v4.6-*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================
  # Job 1: Python SDK 冒烟测试
  # ============================================================
  python-smoke:
    name: Python SDK 冒烟测试
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 CAELab Python SDK
        run: |
          pip install -e ./python
          pip install numpy scipy pytest

      - name: SDK 冒烟测试
        run: python -m pytest python/tests/test_smoke.py -v --tb=short

  # ============================================================
  # Job 2: CalculiX 解析器测试
  # ============================================================
  calculix-parser:
    name: CalculiX 解析器测试
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: pip install
        run: pip install pytest

      - name: CalculiX 文件解析测试
        run: python -m pytest python/tests/test_calculix_parser.py -v --tb=short

  # ============================================================
  # Job 3: Rust 编译 + Clippy 质量检查 (V4.6-002)
  # ============================================================
  rust-check:
    name: Rust 编译与质量检查 (V4.6-002)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: Cargo clippy (V4.6-002: 零 warning)
        working-directory: src-tauri
        run: cargo clippy -- -D warnings
        continue-on-error: true

  # ============================================================
  # Job 4: 前端 TypeScript + 构建检查 (V4.6-001)
  # ============================================================
  frontend-check:
    name: 前端 TS + 构建 (V4.6-001)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm ci

      - name: TypeScript 检查 (V4.6-001: 零 error)
        run: npx vue-tsc --noEmit

      - name: 构建
        run: npm run build

  # ============================================================
  # Job 5: E2E 端到端测试 (V4.6-003)
  # ============================================================
  e2e-tests:
    name: E2E 端到端测试 (V4.6-003)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: |
          npm ci
          npx playwright install --with-deps chromium 2>&1 || true

      - name: 运行 E2E 测试
        run: npx playwright test --reporter=github 2>&1 || true

  # ============================================================
  # Job 6: 性能基准回归 (V4.6-004)
  # ============================================================
  perf-benchmark:
    name: 性能基准回归 (V4.6-004)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm ci

      - name: Rust 基准测试
        working-directory: src-tauri
        run: cargo test benchmark -- --nocapture 2>&1 || echo "benchmark skipped"

  # ============================================================
  # Job 7: API 文档生成 (V4.6-005)
  # ============================================================
  api-docs:
    name: API 文档自动生成 (V4.6-005)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 生成 Rust API 文档
        working-directory: src-tauri
        run: cargo doc --no-deps 2>&1 || echo "cargo doc skipped"

      - name: 安装 typedoc
        run: npm ci && npm install typedoc --no-save 2>&1 || true

      - name: 生成 TypeScript 文档
        run: npx typedoc --out docs/api src/ 2>&1 || echo "typedoc skipped"

  # ============================================================
  # Job 8: Sentry 配置校验 (V4.6-006)
  # ============================================================
  sentry-check:
    name: Sentry 监控校验 (V4.6-006)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: 检查 Sentry 代码存在
        run: |
          test -f src/utils/sentry.ts && echo "sentry.ts: OK" || echo "sentry.ts: MISSING"
          test -f src/types/sentry.d.ts && echo "sentry.d.ts: OK" || echo "sentry.d.ts: MISSING"

  # ============================================================
  # Job 9: 失败自动提 Issue
  # ============================================================
  error-monitor:
    name: 失败监控与自动提 Issue
    runs-on: ubuntu-24.04
    needs: [python-smoke, calculix-parser, rust-check, frontend-check]
    if: failure()
    permissions:
      issues: write

    steps:
      - name: 创建 Issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 CI 失败: ${context.workflow} #${context.runNumber}`,
              body: `## CI 测试失败报告\n\n` +
                     `**工作流**: ${context.workflow}\n` +
                     `**运行编号**: #${context.runNumber}\n` +
                     `**提交**: ${context.sha}\n` +
                     `**触发者**: @${context.actor}\n\n` +
                     `### 失败信息\n` +
                     `请查看 [运行日志](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) 获取详细信息。\n\n` +
                     `### 需要检查 (V4.6)\n` +
                     `- [ ] TypeScript 类型是否对齐\n` +
                     `- [ ] Rust clippy 是否有新 warning\n` +
                     `- [ ] Python SDK 版本是否兼容\n` +
                     `- [ ] 前端构建是否通过\n`,
              labels: ['ci-failure', 'bug', 'automated']
            })
