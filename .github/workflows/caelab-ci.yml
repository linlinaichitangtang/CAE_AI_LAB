name: CAELab V4.5 CI

on:
  push:
    branches: [main, develop, 'v4.5-*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================
  # Job 1: Python SDK 冒烟测试
  # ============================================================
  python-smoke:
    name: Python SDK 冒烟测试
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 CAELab Python SDK
        run: |
          pip install -e ./python
          pip install numpy scipy pytest

      - name: SDK 冒烟测试
        run: python -m pytest python/tests/test_smoke.py -v --tb=short

  # ============================================================
  # Job 2: CalculiX 解析器测试
  # ============================================================
  calculix-parser:
    name: CalculiX 解析器测试
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: pip install
        run: pip install pytest

      - name: CalculiX 文件解析测试
        run: python -m pytest python/tests/test_calculix_parser.py -v --tb=short

  # ============================================================
  # Job 3: Rust 编译检查
  # ============================================================
  rust-check:
    name: Rust 编译检查
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true  # crates.io 网络不稳定

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings
        continue-on-error: true

  # ============================================================
  # Job 4: 前端构建检查
  # ============================================================
  frontend-check:
    name: 前端构建检查
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm ci

      - name: TypeScript 检查
        run: npx vue-tsc --noEmit

      - name: 构建
        run: npm run build

  # ============================================================
  # Job 5: E2E 端到端测试
  # ============================================================
  e2e-tests:
    name: E2E 端到端测试
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true  # 开发阶段不阻断 CI

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: |
          npm ci
          npx playwright install --with-deps chromium 2>&1 || true

      - name: 运行 E2E 测试
        run: npx playwright test --reporter=github 2>&1 || true

  # ============================================================
  # Job 6: API 文档自动生成
  # ============================================================
  api-docs:
    name: API 文档自动生成
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true  # typedoc 可选依赖

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: |
          npm ci
          npm install typedoc --no-save 2>&1 || true

      - name: 生成 TypeScript 文档
        run: npx typedoc --out docs/api src/ 2>&1 || echo "typedoc skipped"

  # ============================================================
  # Job 7: 失败自动提 Issue
  # ============================================================
  error-monitor:
    name: 失败监控与自动提 Issue
    runs-on: ubuntu-24.04
    needs: [python-smoke, calculix-parser, rust-check, frontend-check]
    if: failure()
    permissions:
      issues: write

    steps:
      - name: 创建 Issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 CI 失败: ${context.workflow} #${context.runNumber}`,
              body: `## CI 测试失败报告\n\n` +
                     `**工作流**: ${context.workflow}\n` +
                     `**运行编号**: #${context.runNumber}\n` +
                     `**提交**: ${context.sha}\n` +
                     `**触发者**: @${context.actor}\n\n` +
                     `### 失败信息\n` +
                     `请查看 [运行日志](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) 获取详细信息。\n\n` +
                     `### 需要检查\n` +
                     `- [ ] Python SDK 版本是否兼容\n` +
                     `- [ ] CalculiX 测试文件是否更新\n` +
                     `- [ ] Rust 依赖是否变更\n` +
                     `- [ ] 前端 TypeScript 类型是否对齐\n`,
              labels: ['ci-failure', 'bug', 'automated']
            })
