name: CAELab V4.2 CI

on:
  push:
    branches: [main, develop, 'v4.2-*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================
  # Job 1: Python 桥接冒烟测试 (V4.2-001)
  # ============================================================
  python-smoke:
    name: Python 桥接冒烟测试 (V4.2-001)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 CAELab Python SDK
        run: |
          pip install -e ./python
          pip install numpy scipy pytest

      - name: V4.2-001 SDK 冒烟测试
        run: |
          python -m pytest python/tests/test_smoke.py -v --tb=short

  # ============================================================
  # Job 2: CalculiX 解析器测试 (V4.2-003)
  # ============================================================
  calculix-parser:
    name: CalculiX 解析器测试 (V4.2-003)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install pytest

      - name: V4.2-003 CalculiX 文件解析测试
        run: |
          python -m pytest python/tests/test_calculix_parser.py -v --tb=short

      - name: V4.2-003 Rust 解析器编译检查
        uses: dtolnay/rust-toolchain@stable

      - run: |
          cargo check --lib -p caelab 2>&1 || true
          echo "V4.2-003 Rust parser check: DONE"
        working-directory: src-tauri
        continue-on-error: true

  # ============================================================
  # Job 3: Rust 编译检查
  # ============================================================
  rust-check:
    name: Rust 编译检查
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --all-targets
        continue-on-error: true  # crates.io 可能因网络问题失败

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings
        continue-on-error: true

  # ============================================================
  # Job 4: 前端构建检查
  # ============================================================
  frontend-check:
    name: 前端构建检查
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm ci

      - name: TypeScript 检查
        run: npx vue-tsc --noEmit

      - name: 构建
        run: npm run build

  # ============================================================
  # Job 5: E2E 端到端测试 (V4.6-003)
  # ============================================================
  e2e-tests:
    name: E2E 端到端测试 (V4.6-003)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: 运行 E2E 测试
        run: npx playwright test --reporter=github

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ============================================================
  # Job 6: 失败自动提 Issue
  # ============================================================
  error-monitor:
    name: 失败监控与自动提 Issue
    runs-on: ubuntu-24.04
    needs: [python-smoke, calculix-parser, rust-check, frontend-check, e2e-tests]
    if: failure()
    permissions:
      issues: write

    steps:
      - name: 创建 Issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 CI 失败: ${context.workflow} #${context.runNumber}`,
              body: `## CI 测试失败报告\n\n` +
                     `**工作流**: ${context.workflow}\n` +
                     `**运行编号**: #${context.runNumber}\n` +
                     `**提交**: ${context.sha}\n` +
                     `**触发者**: @${context.actor}\n\n` +
                     `### 失败信息\n` +
                     `请查看 [运行日志](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) 获取详细信息。\n\n` +
                     `### 需要检查\n` +
                     `- [ ] Python SDK 版本是否兼容\n` +
                     `- [ ] CalculiX 测试文件是否更新\n` +
                     `- [ ] Rust 依赖是否变更\n` +
                     `- [ ] 前端 TypeScript 类型是否对齐\n`,
              labels: ['ci-failure', 'bug', 'automated']
            })
